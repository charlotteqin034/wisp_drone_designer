<title>Formation Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-screen editor. Storyboard left, 3D stage centre, inspector right, timeline across the bottom. Single dark look by choice (light-show work happens in the dark). */
:root {
  color-scheme: dark;
  --bg: #0c1018;
  --stage: #080b11;
  --panel: #131925;
  --panel-2: #1a2231;
  --line: #263145;
  --text: #e2e7f0;
  --muted: #8592a7;
  --accent: #a596ff;
  --accent-ink: #120d2b;
  --ok: #5fcf93;
  --warn: #f0b54a;
  --danger: #ff6b72;
  --font-ui: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 6px;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--text); font-family: var(--font-ui); font-size: 13px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px; box-sizing: border-box; overflow: hidden;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }

.app {
  height: 100%; display: grid; gap: 8px;
  grid-template-columns: 250px minmax(0, 1fr) 290px;
  grid-template-rows: auto minmax(0, 1fr) 206px;
  grid-template-areas: "top top top" "story view insp" "time time time";
}
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.eyebrow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.scroll { overflow: auto; min-height: 0; flex: 1; }

/* Top bar */
.top { grid-area: top; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand b { font-weight: 600; font-size: 15px; letter-spacing: .01em; }
.brand input { background: transparent; border: 1px solid transparent; border-radius: 4px; padding: 3px 6px; color: var(--muted); width: 180px; }
.brand input:hover, .brand input:focus { border-color: var(--line); color: var(--text); }
.btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r); padding: 6px 11px; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: #3a4862; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.small { padding: 3px 8px; font-size: 12px; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--text); border-color: var(--line); }
.btn:disabled { opacity: .4; cursor: default; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 10px; font-size: 12px; border: 1px solid var(--line); background: var(--panel); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.pill.ok .dot { background: var(--ok); } .pill.bad .dot { background: var(--danger); }

.savestate { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.savestate::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.savestate[data-state="saved"]::before { background: var(--ok); } .savestate[data-state="saving"]::before { background: var(--accent); }
.savestate[data-state="error"] { color: var(--warn); } .savestate[data-state="error"]::before { background: var(--warn); }
/* Motion */
.mcard { background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; padding: 9px; display: flex; flex-direction: column; gap: 8px; }
.mcard header { display: flex; justify-content: space-between; align-items: center; font-weight: 500; }
.mcard .note { font-size: 11px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; font-size: 11px; font-family: var(--font-data); }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.kd { position: absolute; top: 50%; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; background: #0c1018; border: 1.5px solid #0c1018; transform: rotate(45deg); cursor: pointer; z-index: 2; box-shadow: 0 0 0 1px rgba(255,255,255,.7); }
.kd:hover { background: #fff; }
.mflag { opacity: .75; margin-left: 4px; }

/* Storyboard */
.story { grid-area: story; }
.sb-list { list-style: none; margin: 0; padding: 6px; display: flex; flex-direction: column; gap: 2px; }
.sb-item { display: grid; grid-template-columns: 14px 1fr auto; align-items: center; gap: 9px; padding: 7px 8px; border-radius: 5px; border: 1px solid transparent; cursor: pointer; }
.sb-item:hover { background: var(--panel-2); }
.sb-item.sel { background: var(--panel-2); border-color: var(--accent); }
.sb-item.fixed { cursor: default; color: var(--muted); }
.sb-item .sw { width: 12px; height: 12px; border-radius: 3px; }
.sb-item .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sb-item .tm { color: var(--muted); font-size: 11px; }
.sb-item .warnmark { color: var(--danger); font-size: 11px; margin-left: 4px; }
.sb-gap { font-size: 11px; color: var(--muted); padding: 1px 8px 1px 31px; }
.sb-gap.short { color: var(--danger); }
.sb-actions { display: flex; gap: 4px; padding: 8px; border-top: 1px solid var(--line); flex-wrap: wrap; }

/* Shape picker */
.picker { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px; border-top: 1px solid var(--line); }
.shape-tile { background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; padding: 6px 4px 5px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--muted); }
.shape-tile:hover { border-color: var(--accent); color: var(--text); }
.shape-tile svg { width: 44px; height: 34px; }

/* Stage */
.view { grid-area: view; position: relative; overflow: hidden; background: var(--stage); }
.view canvas { display: block; width: 100%; height: 100%; }
.hud { position: absolute; left: 10px; bottom: 10px; display: flex; gap: 6px; flex-wrap: wrap; pointer-events: none; }
.hud span { background: rgba(12,16,24,.82); border: 1px solid var(--line); border-radius: 4px; padding: 3px 7px; font-size: 11px; color: var(--muted); }
.hud b { color: var(--text); font-weight: 500; }
.hud .bad b { color: var(--danger); }
.viewbtns { position: absolute; right: 10px; top: 10px; display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
#numsBtn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 4px 7px; font-size: 11px; white-space: nowrap; }

/* Inspector */
.insp { grid-area: insp; scroll-margin-top: 10px; }
.insp.flash { animation: flash 1.1s ease-out; }
@keyframes flash { 0% { border-color: var(--danger); box-shadow: 0 0 0 2px rgba(255,107,114,.45); } 100% { border-color: var(--line); box-shadow: 0 0 0 0 rgba(255,107,114,0); } }
#safetyPill { cursor: pointer; }
#safetyPill:hover { border-color: #3a4862; }
.tabs { display: flex; gap: 2px; }
.tab { background: transparent; border: 0; padding: 4px 9px; border-radius: 4px; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--panel-2); color: var(--text); }
.form { padding: 12px; display: flex; flex-direction: column; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field > label, .field > .lbl { font-size: 11px; color: var(--muted); }
.row { display: grid; gap: 6px; }
.row.c2 { grid-template-columns: 1fr 1fr; } .row.c3 { grid-template-columns: 1fr 1fr 1fr; }
.inp { background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 6px 7px; width: 100%; min-width: 0; }
.inp:focus { border-color: var(--accent); outline: none; }
.unit { position: relative; }
.unit .inp { padding-right: 22px; }
.unit i { position: absolute; right: 7px; top: 50%; transform: translateY(-50%); font-style: normal; color: var(--muted); font-size: 11px; pointer-events: none; }
.unit .ax { position: absolute; left: 7px; top: 50%; transform: translateY(-50%); font-style: normal; color: var(--muted); font-size: 11px; }
.unit.axis .inp { padding-left: 18px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 2px; }
.seg button { background: transparent; border: 0; border-radius: 3px; padding: 4px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--text); }
.seg button:disabled { opacity: .4; cursor: default; }
input[type=color].inp { padding: 2px; height: 30px; }
.note { font-size: 12px; color: var(--muted); line-height: 1.45; display: flex; gap: 7px; }
.note .dot { margin-top: 5px; }
.note.ok .dot { background: var(--ok); } .note.bad .dot { background: var(--danger); } .note.info .dot { background: var(--muted); }
.summary dl { display: grid; grid-template-columns: 1fr auto; gap: 7px 10px; margin: 0; }
.summary dt { color: var(--muted); } .summary dd { margin: 0; text-align: right; }
.issue { display: block; width: 100%; text-align: left; background: var(--panel-2); border: 1px solid var(--line); border-left: 3px solid var(--danger); border-radius: 4px; padding: 7px 9px; }
.issue:hover { border-color: #3a4862; border-left-color: var(--danger); }
.issue .t { color: var(--muted); font-size: 11px; }
.empty-ok { color: var(--ok); }

/* Hand-placement bar */
.placebar { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--line); overflow-x: auto; white-space: nowrap; min-height: 40px; background: var(--panel-2); border-radius: var(--r) var(--r) 0 0; scrollbar-width: thin; }
.pb-title { font-weight: 600; font-size: 12px; max-width: 180px; overflow: hidden; text-overflow: ellipsis; flex: none; }
.pb-hint { color: var(--muted); font-size: 12px; }
.pb-group { display: inline-flex; align-items: center; gap: 5px; flex: none; }
.pb-sep { width: 1px; align-self: stretch; background: var(--line); flex: none; margin: 2px 2px; }
.pb-lbl { font-size: 11px; color: var(--muted); }
.pb-seg { display: inline-grid; grid-template-columns: auto auto; }
.pb-seg button { padding: 3px 9px; font-size: 12px; }
.pb-sel { width: auto; padding: 3px 6px; font-size: 12px; }
.pb-num { position: relative; display: inline-flex; align-items: center; }
.pb-num i { position: absolute; left: 6px; font-style: normal; font-size: 10px; color: var(--muted); pointer-events: none; }
.pb-num em { position: absolute; right: 6px; font-style: normal; font-size: 10px; color: var(--muted); pointer-events: none; }
.pb-num .inp { width: 78px; padding: 3px 14px 3px 22px; font-size: 12px; -moz-appearance: textfield; appearance: textfield; }
.pb-num .inp::-webkit-outer-spin-button, .pb-num .inp::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.pb-num.wide .inp { padding-left: 34px; }
.pb-chk { display: inline-flex; gap: 5px; align-items: center; font-size: 12px; color: var(--muted); flex: none; }
.chip.add { border-style: dashed; color: var(--text); }
.chip:hover { border-color: #3a4862; }

/* Timeline */
.time { grid-area: time; }
.transport { display: flex; align-items: center; gap: 6px; padding: 7px 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.clock { font-family: var(--font-data); font-size: 15px; min-width: 120px; }
.clock small { color: var(--muted); font-size: 12px; }
.tl-wrap { position: relative; flex: 1; min-height: 0; padding: 0 10px 8px; }
.tl { position: relative; height: 100%; user-select: none; touch-action: none; }
.ruler { position: absolute; left: 0; right: 0; top: 0; height: 22px; border-bottom: 1px solid var(--line); cursor: ew-resize; }
.tick { position: absolute; top: 0; height: 100%; border-left: 1px solid var(--line); font-size: 10px; color: var(--muted); padding: 4px 0 0 4px; font-family: var(--font-data); }
.track { position: absolute; left: 0; right: 0; top: 28px; height: 40px; }
.blk { position: absolute; top: 0; height: 100%; border-radius: 4px; overflow: hidden; font-size: 11px; padding: 5px 7px; white-space: nowrap; text-overflow: ellipsis; }
.blk.hold { cursor: grab; color: #0c1018; font-weight: 500; }
.blk.hold.sel { outline: 2px solid var(--text); outline-offset: 1px; }
.blk.hold .grip { position: absolute; right: 0; top: 0; bottom: 0; width: 8px; cursor: ew-resize; background: rgba(0,0,0,.18); }
.blk.move { background: repeating-linear-gradient(135deg, var(--panel-2) 0 5px, var(--panel) 5px 10px); border: 1px solid var(--line); color: var(--muted); }
.blk.move.short { border-color: var(--danger); background: repeating-linear-gradient(135deg, rgba(255,107,114,.25) 0 5px, var(--panel) 5px 10px); color: var(--danger); }
.blk.fixed { background: var(--panel-2); border: 1px solid var(--line); color: var(--muted); }
.blk.fixed.hover { background: transparent; border-style: dashed; }
.lenbtn { background: transparent; border: 1px dashed var(--line); border-radius: 4px; padding: 1px 6px; color: var(--muted); font: inherit; font-size: 12px; }
.lenbtn:hover { border-color: var(--accent); color: var(--text); }
.lane2 { position: absolute; left: 0; right: 0; top: 71px; height: 6px; }
.llane { position: absolute; left: 0; right: 0; top: 81px; height: 30px; border-top: 1px dashed var(--line); }
.llabel { position: absolute; left: 4px; top: 9px; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); pointer-events: none; }
.lblk { position: absolute; border-radius: 3px; font-size: 10px; color: #0c1018; padding: 0 4px; overflow: hidden; white-space: nowrap; cursor: grab; box-shadow: inset 0 0 0 1px rgba(0,0,0,.35); display: flex; align-items: center; }
.lblk .nm { background: rgba(226,231,240,.82); border-radius: 2px; padding: 0 3px; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
.lblk.sel { outline: 2px solid var(--text); outline-offset: 1px; z-index: 1; }
.lblk .grip { position: absolute; right: 0; top: 0; bottom: 0; width: 7px; cursor: ew-resize; background: rgba(0,0,0,.25); }
.llist { display: flex; flex-direction: column; gap: 3px; }
.litem { display: grid; grid-template-columns: 28px minmax(0,1fr) auto; gap: 9px; align-items: center; text-align: left; background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; }
.litem:hover { border-color: #3a4862; } .litem.sel { border-color: var(--accent); }
.lsw { width: 28px; height: 16px; border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
.lnm { display: flex; flex-direction: column; min-width: 0; overflow: hidden; } .lnm small { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lt { color: var(--muted); font-size: 11px; }
.ismark { position: absolute; top: 0; height: 100%; background: var(--danger); border-radius: 2px; min-width: 3px; opacity: .85; }
.playhead { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px solid var(--accent); pointer-events: none; }
.playhead::before { content: ""; position: absolute; top: 0; left: -6px; border: 5px solid transparent; border-top: 7px solid var(--accent); }
.speed { background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; }

/* Modal */
.scrim { position: fixed; inset: 0; background: rgba(4,6,10,.65); display: grid; place-items: center; z-index: 20; padding: 16px; }
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; width: min(460px, 100%); max-height: 90%; overflow: auto; }
.modal h2 { font-size: 15px; margin: 0; font-weight: 600; }
.modal .form { gap: 14px; }
.modal.wide { width: min(720px, 100%); }
.exfoot { position: sticky; bottom: 0; background: var(--panel); flex-wrap: wrap; }
.extable { max-height: min(300px, 38vh) !important; }
.bar { height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; } .bar span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .15s; }
.exmeta { display: grid; grid-template-columns: repeat(4, auto); gap: 4px 14px; margin: 0; font-size: 12px; } .exmeta dt { color: var(--muted); } .exmeta dd { margin: 0; }
@media (max-width: 560px) { .exmeta { grid-template-columns: auto auto; } }
.extable { overflow: auto; max-height: 300px; border: 1px solid var(--line); border-radius: 5px; }
.extable table { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
.extable th { position: sticky; top: 0; background: var(--panel-2); text-align: left; font-weight: 500; color: var(--muted); padding: 6px 8px; white-space: nowrap; }
.extable td { padding: 4px 8px; border-top: 1px solid var(--line); white-space: nowrap; } .extable tr.bad td { color: var(--danger); }
.modal footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
.toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; display: flex; gap: 12px; align-items: center; z-index: 30; }

@media (max-width: 900px) {
  body { overflow: auto; }
  html, body { height: auto; }
  .app { height: auto; grid-template-columns: minmax(0,1fr); grid-template-rows: auto 52vh 240px auto auto;
    grid-template-areas: "top" "view" "time" "story" "insp"; }
  .story, .insp { max-height: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app" id="app">
  <header class="top">
    <div class="brand"><b>Formation Studio</b><input id="showName" aria-label="Show name"></div>
    <span class="savestate" id="saveState" data-state="local">Saved in this browser</span>
    <span class="pill" id="safetyPill"><span class="dot"></span><span id="safetyText">Checking…</span></span>
    <button class="btn" id="undoBtn" title="Undo (Ctrl+Z)">Undo</button>
    <button class="btn" id="tightenBtn" title="Shorten every transition to the fastest safe time">Tighten timing</button>
    <button class="btn" id="fileBtn">File</button>
    <button class="btn" id="settingsBtn">Show settings</button>
    <button class="btn primary" id="exportBtn">Export drone files</button>
  </header>

  <section class="panel story" aria-label="Storyboard">
    <div class="panel-head"><span class="eyebrow">Storyboard</span><span class="num" id="droneCountLbl" style="color:var(--muted);font-size:11px"></span></div>
    <div class="scroll"><ul class="sb-list" id="sbList"></ul></div>
    <div class="sb-actions">
      <button class="btn small" id="addBtn">+ Add formation</button>
      <button class="btn small ghost" id="dupBtn">Duplicate</button>
      <button class="btn small ghost" id="upBtn" aria-label="Move earlier">↑</button>
      <button class="btn small ghost" id="downBtn" aria-label="Move later">↓</button>
      <button class="btn small ghost" id="delBtn">Delete</button>
    </div>
    <div class="picker" id="picker" hidden></div>
  </section>

  <section class="panel view" aria-label="3D stage" id="view">
    <canvas id="cv"></canvas>
    <div class="viewbtns">
      <button class="btn small" data-cam="front">Audience view</button>
      <button class="btn small" data-cam="top">Top</button>
      <button class="btn small" data-cam="side">Side</button>
      <button class="btn small" id="numsBtn" aria-pressed="false" title="Show each drone's number, which matches its export file and takeoff pad">Numbers</button>
    </div>
    <div class="hud" id="hud"></div>
    <div class="tip" id="tip" hidden></div>
  </section>

  <section class="panel insp" aria-label="Inspector">
    <div class="panel-head">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tabForm" aria-selected="true">Formation</button>
        <button class="tab" role="tab" id="tabLights" aria-selected="false">Lights</button>
        <button class="tab" role="tab" id="tabSafety" aria-selected="false">Safety</button>
      </div>
    </div>
    <div class="scroll" id="inspBody"></div>
  </section>

  <section class="panel time" aria-label="Timeline">
    <div class="placebar" id="placeBar" aria-label="Hand placement"></div>
    <div class="transport">
      <button class="btn small" id="toStart" aria-label="Go to start">⏮</button>
      <button class="btn small" id="prevF" aria-label="Previous formation">◀︎◀︎</button>
      <button class="btn small primary" id="playBtn" style="min-width:64px">Play</button>
      <button class="btn small" id="nextF" aria-label="Next formation">▶︎▶︎</button>
      <select class="speed" id="speed" aria-label="Playback speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select>
      <span class="clock"><span id="clockNow"></span> <small>/</small> <button class="lenbtn num" id="lenBtn" title="Change the length of the show"></button></span>
      <span style="margin-left:auto;color:var(--muted);font-size:11px">Drag a formation block to move it · drag its right edge to change the hold</span>
    </div>
    <div class="tl-wrap"><div class="tl" id="tl">
      <div class="ruler" id="ruler"></div>
      <div class="track" id="track"></div>
      <div class="lane2" id="lane2"></div>
      <div class="llane" id="llane"></div>
      <div class="playhead" id="playhead"></div>
    </div></div>
  </section>

Metres. x runs left to right as the audience sees it, y points away from the audience, z points up. The origin is the centre of the flight-area floor. Drone N takes off from takeoff pad N (see takeoff_layout.csv).

## .bin layout (little-endian)
| Offset | Type | Field |
|---|---|---|
| 0 | 4 × char | Magic "DSHW" |
| 4 | uint16 | Format version (1) |
| 6 | uint16 | Drone number (1-based, matches the designer) |
| 8 | uint32 | Show ID (changes whenever the show changes) |
| 12 | uint32 | Piece count (P) |
| 16 | uint32 | LED event count (E) |
| 20 | float32 | Show length in seconds |
| 24 | uint32 | CRC-32 (IEEE) of the whole file, computed with these 4 bytes set to zero |
| 28 | uint32 | Reserved (0) |
| 32 | P × 132 bytes | Trajectory pieces |

  B.querySelectorAll("[data-txt]").forEach(b => b.onclick = () => { const r = x.rows[+b.dataset.txt - 1]; save(`drone_${pad2(r.drone)}.txt`, r.txt); });
};

// ---------- Show length ----------
function parseTime(v) { v = String(v).trim(); if (!v) return NaN; if (v.includes(":")) { const [m, s2] = v.split(":"); return parseFloat(m) * 60 + parseFloat(s2 || 0); } return parseFloat(v); }
function stretchShow(L) { // scale every formation's timing, holds, keyframes and motion so the show lasts L seconds
  const c = compiled, tk = c.segs[0].t1, ret = c.segs[c.segs.length - 2], land = c.segs[c.segs.length - 1], hv = c.segs.find(g => g.kind === "hover");
  const tail = (ret.t1 - ret.t0) + (land.t1 - land.t0), content = c.duration - tk - tail; // extra time stretches too, so moments keep their place in the show
  if (content < 0.5) { show.settings.length = L; return; }
  const k = Math.max(0.05, (L - tk - tail) / content), r1 = (x) => Math.round(x * 10) / 10;
  (show.lights || []).forEach(L => { if (L.t0 >= tk) L.t0 = r1(tk + (L.t0 - tk) * k); L.dur = Math.max(0.1, r1(L.dur * k)); });
  show.formations.forEach(f => { const h = holdOf(f); f.start = r1(tk + ((h ? h.t0 : f.start) - tk) * k); f.hold = Math.max(0.1, r1(f.hold * k));
    (f.keys || []).forEach(q => q.t = Math.max(0.1, Math.min(f.hold, r1(q.t * k)))); });
  show.settings.length = L;
}
$("lenBtn").onclick = () => {
  const hv = compiled.segs.find(g => g.kind === "hover"), extra = hv ? hv.t1 - hv.t0 : 0, shortest = compiled.duration - extra;
  $("modalRoot").innerHTML = `<div class="scrim" id="scrim"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="lnTitle">
    <div class="panel-head"><h2 id="lnTitle">Show length</h2><button class="btn small ghost" id="lnX" aria-label="Close">✕</button></div>
    <div class="form">
      <div class="field"><label for="lnVal">Total length, takeoff to landing (minutes:seconds)</label><input class="inp num" id="lnVal" value="${fmt(compiled.duration)}"></div>
      <div class="field"><span class="lbl">How to change it</span>
        <label style="display:flex;gap:8px;align-items:flex-start"><input type="radio" name="lnMode" value="end" checked><span>Add or remove time at the end. Drones hover before they return, and you can drag them in that time to add new poses.</span></label>
        <label style="display:flex;gap:8px;align-items:flex-start"><input type="radio" name="lnMode" value="stretch"><span>Stretch everything to fit. Formations, holds, keyframes and motion all take proportionally longer or shorter.</span></label></div>
      <p class="note info"><span class="dot"></span><span>The formations need at least <b class="num">${fmt(shortest)}</b> as they are now${extra ? `; there is ${fmt(extra)} of extra time at the end` : ""}.</span></p>
      <p class="note bad" id="lnMsg" hidden><span class="dot"></span><span></span></p>
    </div>
    <footer>${show.settings.length ? `<button class="btn ghost" id="lnReset" style="margin-right:auto">Remove extra time</button>` : ""}<button class="btn" id="lnCancel">Cancel</button><button class="btn primary" id="lnOk">Apply</button></footer></div></div>`;
  const close = () => { $("modalRoot").innerHTML = ""; };
  $("lnX").onclick = $("lnCancel").onclick = close; $("scrim").onclick = (e) => { if (e.target.id === "scrim") close(); };
  if ($("lnReset")) $("lnReset").onclick = () => { show.settings.length = 0; commit(); close(); rebuildAll(); };
  $("lnOk").onclick = () => {
    const L = parseTime($("lnVal").value), mode = document.querySelector("input[name=lnMode]:checked").value, err = (m) => { const el = $("lnMsg"); el.hidden = false; el.lastElementChild.textContent = m; };
    if (!isFinite(L) || L <= 0) return err("Enter a length like 2:30 or 150.");
    if (L > 3600) return err("Keep the show under an hour.");
    if (mode === "end") { if (L < shortest - 0.05) return err(`That's shorter than the formations need (${fmt(shortest)}). Choose "Stretch everything" or shorten some formations.`);
      show.settings.length = L; }
    else stretchShow(L);
    commit(); close(); rebuildAll(); toast(`The show now lasts ${fmt(compiled.duration)}`, "Undo", undo);
  };
  $("lnVal").focus(); $("lnVal").select();
};

// ---------- Toast ----------
let toastTimer = 0;
function toast(msg, action, fn) {
  let el = document.querySelector(".toast"); if (!el) { el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); document.body.appendChild(el); }
  el.innerHTML = `<span>${esc(msg)}</span>${action ? `<button class="btn small">${action}</button>` : ""}`;
  if (action) el.querySelector("button").onclick = () => { fn(); el.remove(); };
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.remove(), 4500);
}

// ---------- Glue ----------
$("showName").value = show.name;
$("showName").addEventListener("input", () => { show.name = $("showName").value; saveShow(); }); $("showName").addEventListener("change", commit);
function refreshLight() { scheduleCheck(); }
function rebuildAll() {
  if (!Array.isArray(show.lights)) show.lights = [];
  compiled = compile(show); $("showName").value = show.name;
  if (drones.length !== compiled.N) buildDrones();
  [...edit.sel].forEach(k => { if (k >= compiled.N) edit.sel.delete(k); });
  buildArea(); buildGhost(); renderStory(); renderInspector(); renderTimeline(); scheduleCheck();
  t = Math.min(t, compiled.duration);
}
function frameStats(P) {
  let md = Infinity; for (let i = 0; i < P.length; i++) for (let j = i + 1; j < P.length; j++) md = Math.min(md, d3(P[i], P[j]));
  const Q = positionsAt(compiled, Math.max(0, t - 0.02)); let mv = 0; if (t > 0.02) for (let i = 0; i < P.length; i++) mv = Math.max(mv, d3(P[i], Q[i]) / 0.02);
  return { md, mv };
}
let last = performance.now(), statTick = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (playing) { t += dt * parseFloat($("speed").value); if (t >= compiled.duration) { t = compiled.duration; playing = false; updatePlay(); } }
  const P = positionsAt(compiled, t);
  const hg = activeHold(), mine = hg && hg.fid === selectedId ? hg : null;
  if (edit.drag && (mine || edit.drag.free)) for (const [k, p] of edit.drag.cur) { const di = edit.drag.droneOf.get(k); if (di !== undefined) P[di] = p; }
  const bad = !playing && mine ? crowded(P, show.settings.minSpacing) : null, C = lightsAt(compiled, show.lights, t, P);
  drones.forEach((d, i) => { const v = S2T(P[i]); d.core.position.copy(v); d.glow.position.copy(v);
    const [r, g, b] = C[i], br = Math.max(r, g, b) / 255; // an unlit drone stays visible as a dark body
    if (i === hoverIdx) d.core.material.color.set("#ffffff"); else d.core.material.color.setRGB(Math.max(r / 255, .17), Math.max(g / 255, .2), Math.max(b / 255, .26));
    d.glow.material.color.setRGB(r / 255, g / 255, b / 255); d.glow.material.opacity = .9 * br; d.glow.scale.setScalar(i === hoverIdx ? .7 : .42);
    const chosen = (mine && edit.sel.has(mine.map[i])) || (!hg && edit.free.has(i)), warn = bad && bad[i];
    if (d.label.visible) { d.label.position.copy(v); d.label.position.y += 0.15; }
    d.ring.visible = !!(chosen || warn); if (d.ring.visible) { d.ring.position.copy(v); d.ring.quaternion.copy(camera.quaternion); d.ring.material.color.set(chosen ? "#ffffff" : "#ff6b72"); } });
  ghostGroup.children.forEach(m => { if (m.userData.billboard) m.quaternion.copy(camera.quaternion); });
  if (hoverIdx >= 0) { const p = P[hoverIdx]; $("tip").innerHTML = `<b>Drone ${hoverIdx + 1}</b>${hg ? ` · spot ${hg.map[hoverIdx] + 1} of ${esc(hg.label)}` : ""} <span class="num">x ${p[0].toFixed(2)} · y ${p[1].toFixed(2)} · z ${p[2].toFixed(2)}</span>`; }
  if (++statTick % 6 === 0) {
    const s = frameStats(P), st = show.settings, seg = segAt(compiled, t);
    $("hud").innerHTML = `<span>Now: <b>${esc(seg.kind === "hold" ? seg.label : seg.kind === "move" ? (seg.fid ? "Moving " + seg.label : "Returning") : seg.label)}</b></span>
      <span class="${s.md < st.minSpacing - 1e-6 ? "bad" : ""}">Closest pair <b class="num">${isFinite(s.md) ? s.md.toFixed(2) : "–"} m</b></span>
      <span class="${s.mv > st.maxSpeed * 1.03 ? "bad" : ""}">Fastest drone <b class="num">${s.mv.toFixed(2)} m/s</b></span>`;
  }
  refreshPlaceBar(false);
  if (tab === "lights") { const o = $("addLight"), now = fmt(t); if (o && o.dataset.at !== now) { o.dataset.at = now; const pk = selectedDrones().length;
    o.options[0].textContent = `+ Add light effect at ${now}${pk ? ` for ${pk} selected drone${pk > 1 ? "s" : ""}` : ""}…`; } }
  renderPlayhead(); controls.update(); renderer.render(scene, camera); requestAnimationFrame(frame);
}
buildDrones(); rebuildAll(); resize(); setCam("front"); select(selectedId, false); t = 0; requestAnimationFrame(frame);
</script>
